<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wire Instruction Extractor</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #edf2f7;
        color: #172033;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 640px); background: #fff; border: 1px solid #d9e1ec; box-shadow: 0 18px 55px #19375a1a; }
      header { background: #12355b; color: #fff; padding: 32px; }
      h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.25rem); letter-spacing: -0.04em; }
      header p { margin: 0; color: #d6e6f6; line-height: 1.5; }
      form { padding: 30px 32px 32px; display: grid; gap: 22px; }
      label { display: grid; gap: 8px; font-weight: 700; font-size: 0.94rem; }
      input[type="file"], input[type="url"] { width: 100%; border: 1px solid #aebdcc; border-radius: 4px; padding: 12px; font: inherit; }
      input[type="file"] { background: #f8fafc; }
      small { color: #516174; font-weight: 400; line-height: 1.45; }
      button { border: 0; border-radius: 4px; padding: 13px 18px; background: #e67723; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
      button:hover { background: #c95f13; }
      button:disabled { background: #9ba9b8; cursor: wait; }
      #status { min-height: 24px; margin: 0; font-size: 0.94rem; line-height: 1.5; }
      #status.error { color: #a11b1b; }
      #status.success { color: #176c3a; }
      .rule { border: 0; border-top: 1px solid #d9e1ec; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Wire Instruction Extractor</h1>
        <p>Upload a document or ZIP archive and download an Excel workbook of the extracted results.</p>
      </header>
      <form id="extract-form">
        <label>
          Document or ZIP archive
          <input id="file" name="file" type="file" required accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.tif,.tiff,.zip" />
          <small>ZIP files are processed one document at a time in parallel. The workbook highlights values that need review.</small>
        </label>
        <label>
          Original source URL <small>(optional)</small>
          <input id="source-url" name="source_url" type="url" placeholder="https://storage.example.net/wires/instruction.pdf" />
        </label>
        <hr class="rule" />
        <button id="submit" type="submit">Extract to Excel</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const form = document.querySelector("#extract-form");
      const submit = document.querySelector("#submit");
      const status = document.querySelector("#status");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = document.querySelector("#file").files[0];
        if (!file) return;

        const data = new FormData();
        data.append("file", file);
        const sourceUrl = document.querySelector("#source-url").value.trim();
        if (sourceUrl) data.append("source_url", sourceUrl);

        submit.disabled = true;
        status.className = "";
        status.textContent = "Extracting fields. This can take a moment for each document.";

        try {
          const response = await fetch("/extract", { method: "POST", body: data });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.detail || "The extraction request failed.");
          }

          const workbook = await response.blob();
          const downloadUrl = URL.createObjectURL(workbook);
          const link = document.createElement("a");
          link.href = downloadUrl;
          link.download = "wire-instruction-results.xlsx";
          link.click();
          URL.revokeObjectURL(downloadUrl);
          status.className = "success";
          status.textContent = "Excel workbook downloaded. Review highlighted cells before using the results.";
        } catch (error) {
          status.className = "error";
          status.textContent = error.message;
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
